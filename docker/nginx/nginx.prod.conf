# The host nginx terminates TLS and proxies here over 127.0.0.1, so take the
# client address and scheme from the headers it sets.
map $http_x_forwarded_proto $fwd_https {
    https   on;
    default "";
}

server {
    listen 80;
    server_name _;
    root /var/www/app/public;

    index index.php index.html;
    client_max_body_size 64m;
    charset utf-8;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /images/* is Laravel's redirect to DO Spaces, never a file on disk.
    location ^~ /images/ {
        try_files $uri /index.php?$query_string;
    }

    # Laravel's front controller is the only script that runs. Any other .php,
    # such as one dropped into an upload folder, is refused.
    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS $fwd_https;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
